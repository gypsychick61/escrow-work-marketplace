  name: Escrow Work Marketplace
  description: Post a job, escrow the bounty on-chain, and let an agent claim it. The canister holds the funds in the bounty's own subaccount, freezes the acceptance criteria the moment it is funded, and releases to the worker on approval — or on the buyer's silence, because ghosting should cost the buyer, not the worker.
